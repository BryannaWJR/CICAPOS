{% raw %}
<style>

/* Power Pages chrome only — keep prototype header.p-head inside #app */
body.citf-proto > header.p-head,
body.citf-proto > a.skip,
body.citf-proto .footer,
body.citf-proto .navbar,
body.citf-proto #navbar,
body.citf-proto .page-header { display: none !important; }
body.citf-proto #mainContent,
body.citf-proto .wrapper-body,
body.citf-proto .page-copy { margin: 0 !important; padding: 0 !important; max-width: none !important; }
body.citf-proto { background: var(--bg) !important; }
body.citf-proto #app > header.p-head,
body.citf-proto #app header.p-head { display: block !important; }


:root{
  /* CIC Foundation / Colours; legacy variable names retained for existing templates. */
  --cic-emerald:#007971; --cic-deep:#085669; --cic-teal:#109B9D; --cic-pale:#CFE9E6;
  --navy:var(--cic-emerald); --navy-d:var(--cic-deep); --gold:var(--cic-pale); --gold-ink:var(--cic-deep);
  --bg:#F4F5F7; --card:#FFFFFF; --line:#DDE1E6; --line-2:#EEF0F2;
  --ink:#1F2933; --ink-2:#3E4C59; --muted:#52606D; --field:#9AA5B1;
  --ok:#1E6B3A; --ok-bg:#E3F4E8; --warn:#92400E; --warn-bg:#FFF4E5; --err:#B42318; --err-bg:#FDECEA;
  --info:#0F5BA8; --info-bg:#E8F0FA;
  --d-bar:var(--cic-deep); --d-bg:#F3F2F1; --d-line:#E1DFDD; --d-pri:var(--cic-emerald); --d-ink:#242424; --d-muted:#605E5C;
  --demo:#14202E; --demo-ink:#F5F7FA; --demo-muted:#AEB8C5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
a{color:var(--navy)} a:hover{color:var(--navy-d)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cic-deep);outline-offset:2px}
.sr{position:absolute;left:-9999px}

/* demo bar */
.demo{position:sticky;top:0;z-index:50;background:var(--demo);color:var(--demo-ink);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;font-size:13px}
.demo b{font-size:14px;margin-right:4px}
.demo .seg{display:inline-flex;border:1px solid #3A4A5E;border-radius:6px;overflow:hidden}
.demo .seg a{padding:6px 12px;color:var(--demo-muted);text-decoration:none}
.demo .seg a.on{background:var(--gold);color:#1B2633;font-weight:600}
.demo .sp{flex:1}
.demo button{background:#1E2C3D;border:1px solid #3A4A5E;color:var(--demo-ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.demo button:hover{border-color:var(--gold)}
.demo .badge{background:var(--gold);color:#1B2633;border-radius:9px;padding:0 6px;font-size:11px;font-weight:700;margin-left:4px}

/* portal */
.p-head{background:var(--navy);color:#fff}
.p-head .in{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:38px;height:38px;border:2px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--gold)}
.logo b{display:block;font-size:16px}.logo small{color:#C8D3E0;font-size:12px}
.p-nav{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.p-nav a{color:#fff;text-decoration:none;padding-bottom:2px;border-bottom:2px solid transparent}
.p-nav a.on{font-weight:600;border-bottom-color:var(--gold)}
.p-nav .who{color:#C8D3E0}
.p-main{max-width:1150px;margin:0 auto;padding:28px 24px 60px;display:flex;flex-direction:column;gap:18px}
.p-main.narrow{max-width:760px}
h1{margin:0;font-size:24px;font-weight:600;color:var(--navy)}
h2{margin:0;font-size:17px;color:var(--navy)}
h3{margin:0;font-size:15px}
.sub{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.between{justify-content:space-between}
.ai-suggest-row{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:8px!important;align-items:center!important;width:100%!important;max-width:100%!important}
.ai-suggest-row input#aiDesc,.ai-suggest-row input.ai-desc{width:100%!important;min-width:0!important;max-width:none!important;flex:none!important;box-sizing:border-box!important;height:40px}
.ai-suggest-row .btn,.ai-suggest-row button{width:auto!important;min-width:96px!important;max-width:140px!important;flex:none!important;justify-self:end}
.col{display:flex;flex-direction:column;gap:6px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.f>.lb{font-size:13px;font-weight:600}
.f input[type=text],.f input[type=email],.f input[type=password],.f input[type=date],.f input[type=datetime-local],.f input[type=number],.f input[type=tel],.f select,.f textarea{height:40px;border:1px solid var(--field);border-radius:4px;padding:0 10px;background:#fff;width:100%}
.f textarea{height:auto;padding:8px 10px;resize:vertical}
.f input[readonly],.f input:disabled,.f select:disabled{background:var(--bg);color:var(--muted)}
.f .hint{font-size:12px;color:var(--muted)}
.f .er{font-size:12px;color:var(--err)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--err)}
.opts{display:flex;flex-wrap:wrap;gap:8px 20px}
.opts label,.chk{display:flex;gap:8px;align-items:center;font-weight:400}
.btn{height:40px;padding:0 18px;border-radius:4px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--navy);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.ghost{border-color:var(--field);color:var(--ink-2)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{background:#CBD2D9;border-color:#CBD2D9;color:#fff;cursor:not-allowed}
.ai-spin{display:inline-block;width:14px;height:14px;border:2px solid #d0d5dd;border-top-color:var(--navy);border-radius:50%;animation:aiSpin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes aiSpin{to{transform:rotate(360deg)}}
.ai-overlay{position:fixed;inset:0;background:rgba(255,255,255,.72);z-index:80;display:flex;align-items:center;justify-content:center}
.ai-overlay .box{background:#fff;border:1px solid var(--field);border-radius:8px;padding:16px 20px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:#EEF0F2;color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.err{background:var(--err-bg);color:var(--err)}
.note{border-radius:6px;padding:12px 16px;font-size:14px}
.note.info{background:#E1EBF5;color:var(--navy-d)}.note.warn{background:var(--warn-bg);color:#6B3E00;border:1px solid #F0B866}.note.err{background:var(--err-bg);color:var(--err)}.note.ok{background:var(--ok-bg);color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;background:var(--bg);padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#F8FAFC}
.scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.steps li i{height:6px;border-radius:3px;background:#CBD2D9;display:block}
.steps li.done{color:var(--ok)}.steps li.done i{background:var(--ok)}
.steps li.cur{color:var(--navy);font-weight:700}.steps li.cur i{background:var(--navy)}
.steps li a{color:inherit;text-decoration:none}
@media(max-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--field);background:#fff;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.pcard dl{margin:0;display:grid;grid-template-columns:140px 1fr;gap:5px 10px;font-size:13px}
.pcard dt{color:var(--muted)}.pcard dd{margin:0}
.kicker{font-size:12px;font-weight:700;color:var(--gold-ink)}
.side{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.side>.menu{flex:1 1 220px;max-width:260px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column}
.side>.menu a{padding:11px 14px;border-radius:4px;text-decoration:none;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.side>.menu a.on{background:#E1EBF5;font-weight:600}
.side>.body{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;flex-wrap:wrap;gap:22px;border-bottom:1px solid var(--line)}
.tabs a{padding:12px 0;text-decoration:none;color:var(--ink-2);border-bottom:3px solid transparent}
.tabs a.on{color:var(--navy);font-weight:600;border-bottom-color:var(--navy)}
.drop{border:2px dashed var(--field);border-radius:6px;padding:14px;background:#FAFBFC;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--muted)}
.drop.has{border-style:solid;border-color:var(--line);background:#fff;color:var(--ink)}
.todo a{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--warn-bg);border-radius:4px;color:#6B3E00;text-decoration:none}
.sig{width:100%;height:150px;border:1px solid var(--field);border-radius:4px;background:#fff;touch-action:none;cursor:crosshair;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}.kpi small{color:var(--muted)}.kpi b{display:block;font-size:26px}
.gw{max-width:520px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:14px}

/* modal + toast — beat Bootstrap .modal (fixed top-left) */
.scrim{position:fixed!important;inset:0!important;background:rgba(15,23,42,.55);z-index:2000!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:20px;margin:0!important}
#modalRoot .modal,.scrim>.modal{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;inset:auto!important;margin:0 auto!important;transform:none!important;background:#fff;border-radius:8px;max-width:520px;width:min(520px,100%);height:auto!important;max-height:90vh!important;min-height:0!important;overflow:auto;padding:24px;padding-top:28px;display:flex!important;flex-direction:column;flex:0 1 auto!important;align-self:center!important;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);z-index:auto!important}
.modal.wide{max-width:760px}
.modal .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.modal-x{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;z-index:2}
.modal-x:hover{color:var(--ink);background:var(--line-2)}
#modalRoot .modal>h2:first-of-type,.scrim>.modal>h2:first-of-type{padding-right:36px;margin-right:8px}
.toast{position:fixed;right:20px;bottom:20px;z-index:90;background:var(--ok);color:#fff;border-radius:6px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:360px}
.toast.err{background:var(--err)}
.phone{width:340px;max-width:100%;border:10px solid #1F2933;border-radius:32px;overflow:hidden;background:var(--bg);margin:0 auto}
.phone .top{background:var(--navy);color:#fff;padding:14px;font-weight:700}
.phone .in{padding:18px;display:flex;flex-direction:column;gap:12px}

/* D365 */
.d{background:var(--d-bg);color:var(--d-ink);min-height:calc(100vh - 44px)}
.d a{color:var(--d-pri)}
.d-head{height:48px;background:var(--d-bar);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
.d-head .who select{background:#24496F;color:#fff;border:1px solid #3B638C;border-radius:4px;height:30px;padding:0 6px}
.d-wrap{display:flex;flex-wrap:wrap}
.d-map{flex:1 1 220px;max-width:240px;background:#fff;border-right:1px solid var(--d-line);padding:10px 0;font-size:13px;min-height:calc(100vh - 92px)}
.d-map .grp{padding:12px 16px 6px;font-size:12px;font-weight:600;color:var(--d-muted)}
.d-map a{display:block;padding:8px 16px;color:var(--d-ink);text-decoration:none}
.d-map a.on{background:var(--info-bg);border-left:3px solid var(--d-pri);font-weight:600}
@media(max-width:700px){.d-map{max-width:none;min-height:0;display:flex;flex-wrap:wrap}.d-map .grp{width:100%}}
.d-body{flex:999 1 600px;min-width:0;display:flex;flex-direction:column}
.cmd{background:#fff;border-bottom:1px solid var(--d-line);padding:6px 12px;display:flex;flex-wrap:wrap;gap:4px}
.cmd button{height:34px;padding:0 12px;background:transparent;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.cmd button:hover{background:#F3F2F1}
.cmd button.pri{background:var(--d-pri);color:#fff;font-weight:600}
.cmd button:disabled{color:#A19F9D;cursor:not-allowed;background:transparent}
.d-in{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.d h1{font-size:20px;color:var(--d-ink)} .d h2{font-size:15px;color:var(--d-ink)}
.dcard{background:#fff;border:1px solid var(--d-line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px}
.d .f input,.d .f select,.d .f textarea{height:32px;border-color:#8A8886;font-size:13px}
.d .f textarea{height:auto}
.d .f>label{font-size:12px;font-weight:400;color:var(--d-muted)}
.d .tbl{font-size:13px}.d .tbl th{background:#fff}.d .tbl td{padding:9px 12px}
.d .btn{height:32px;font-size:13px;border-color:#8A8886;color:var(--d-ink);font-weight:400}
.d .btn.pri{background:var(--d-pri);border-color:var(--d-pri);color:#fff;font-weight:600}
.bpf{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap}
.bpf li{flex:1 1 110px;padding:9px 12px;font-size:13px;background:#fff;border:1px solid var(--d-line);color:var(--d-muted)}
.bpf li.done{background:#DFF0E3;color:#1E5631;font-weight:600;border-color:#DFF0E3}
.bpf li.cur{background:var(--d-pri);color:#fff;font-weight:600;border-color:var(--d-pri)}
.d-tabs{display:flex;gap:18px;border-bottom:1px solid var(--d-line);flex-wrap:wrap}
.d-tabs a{padding:8px 0;text-decoration:none;color:var(--d-ink)!important;border-bottom:2px solid transparent}
.d-tabs a.on{border-bottom-color:var(--d-pri);font-weight:600}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--d-muted)}
.qr{display:block;margin:0 auto;border:1px solid var(--line);padding:10px;background:#fff;cursor:pointer}
.mail{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.mail .m{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.mail .m small{color:var(--muted)}
.dcard.row{flex-direction:row;align-items:center}
.card.row{flex-direction:row}
.p-head select{background:#fff;color:var(--ink);border:1px solid var(--field)}
.todo a span:last-child{white-space:nowrap}

/* ===== D365 Unified Interface look ===== */
.u{--u-pri:var(--cic-emerald);--u-pri-d:var(--cic-deep);--u-bar:var(--cic-deep);--u-line:#E1DFDD;--u-bg:#F3F2F1;--u-ink:#242424;--u-muted:#616161;--u-sel:var(--cic-pale);font-size:14px;color:var(--u-ink);background:var(--u-bg);min-height:calc(100vh - 44px);display:flex;flex-direction:column}
.u a{color:var(--u-pri-d);text-decoration:none}.u a:hover{text-decoration:underline}
.u-top{height:48px;background:var(--u-bar);color:#fff;display:flex;align-items:center;gap:14px;padding:0 12px 0 0;flex-shrink:0}
.u-waffle{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.12)}
.u-top .brand{font-weight:600;font-size:15px}.u-top .app{font-size:15px;opacity:.95;padding-left:14px;border-left:1px solid rgba(255,255,255,.35)}
.u-top .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:4px;height:32px;padding:0 10px;width:280px;max-width:30vw;color:#DCE3EE;font-size:13px}
.u-top .ic{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;opacity:.9}
.u-top .who{display:flex;align-items:center;gap:8px;font-size:12px}
.u-top .who select{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:4px;height:28px;font-size:12px;max-width:210px}
.u-top .who select option{color:#242424}
.u-av{width:32px;height:32px;border-radius:50%;background:#C9A961;color:#002050;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.u-wrap{display:flex;flex:1;min-height:0}
.u-map{width:228px;flex-shrink:0;background:#fff;border-right:1px solid var(--u-line);padding:6px 0 20px;font-size:14px;overflow:auto}
.u-map .hb{height:40px;display:flex;align-items:center;padding:0 16px;color:var(--u-muted)}
.u-map .grp{padding:14px 16px 4px;font-size:13px;font-weight:600;color:var(--u-ink)}
.u-map a{display:flex;align-items:center;gap:10px;height:36px;padding:0 14px 0 16px;color:var(--u-ink)!important;text-decoration:none!important;border-left:3px solid transparent}
.u-map a:hover{background:#F5F5F5}
.u-map a.on{background:#EDEBE9;border-left-color:var(--u-pri);font-weight:600}
.u-map svg{flex-shrink:0;color:var(--u-muted)}
.u-area{margin:14px 10px 0;border-top:1px solid var(--u-line);padding-top:10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--u-muted)}
.u-area b{width:28px;height:28px;border-radius:4px;background:#5C2E91;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
@media(max-width:820px){.u-map{display:none}.u-top .search{display:none}}
.u-main{flex:1;min-width:0;display:flex;flex-direction:column}
.u-cmd{background:#fff;border-bottom:1px solid var(--u-line);min-height:44px;display:flex;flex-wrap:wrap;align-items:center;padding:0 8px;gap:2px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.u-cmd button{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:none;background:transparent;border-radius:4px;font-size:14px;cursor:pointer;color:var(--u-ink)}
.u-cmd button:hover{background:#F3F2F1}.u-cmd button:disabled{color:#BDBDBD;cursor:default;background:transparent}
.u-cmd button svg{color:var(--u-pri)} .u-cmd button:disabled svg{color:#BDBDBD}
.u-cmd .sep{width:1px;height:20px;background:var(--u-line);margin:0 4px}
.u-body{padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
.u-vh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.u-vh h1{font-size:20px;font-weight:600;margin:0;color:var(--u-ink);display:flex;align-items:center;gap:6px}
.u-vh select.vsel{font-size:20px;font-weight:600;border:none;background:transparent;padding:0;color:var(--u-ink);cursor:pointer;max-width:100%}
.u-filter{display:flex;align-items:center;gap:6px;border:1px solid #D1D1D1;border-radius:4px;height:32px;padding:0 8px;background:#fff;color:var(--u-muted);font-size:13px;min-width:220px}
.u-filter input{border:none;outline:none;font-size:13px;width:100%}

/* CIC theme adaptation: Power Pages supports scoped custom CSS; model-driven
   apps use modern theme colours while retaining native Fluent control geometry. */
.p-head,.p-main,.gw,body:has(.p-head) .modal{
  font-family:'Fira Sans','Noto Sans TC','Segoe UI',system-ui,sans-serif;
}
.p-head{background:var(--cic-deep);border-bottom:4px solid var(--cic-teal)}
.p-head .in{padding-top:16px;padding-bottom:16px}
.p-head .logo small,.p-nav .who{color:var(--cic-pale)}
.p-head .logo .mark{border-color:var(--cic-pale);color:#fff}
.p-nav a{padding:8px 0;border-bottom-width:3px}
.p-nav a:hover{color:var(--cic-pale);border-bottom-color:var(--cic-pale)}
.p-head :focus-visible,.demo :focus-visible{outline-color:#fff}
.p-main{gap:20px}
.p-main h1{font-size:28px;line-height:1.25;font-weight:700;color:var(--cic-deep)}
.p-main h2{font-size:20px;line-height:1.25;font-weight:600;color:var(--cic-deep)}
.p-main h3{line-height:1.25}
.p-main :is(.card,.scroll,.kpi,.side>.menu){border-radius:4px}
.p-main .card{gap:16px}
.p-main .kpi b{color:var(--cic-deep)}
.p-main .tbl th{background:var(--cic-pale);color:var(--cic-deep)}
.p-main .tbl tr.click:hover td{background:#F0F8F7}
.p-main .side>.menu a.on{background:var(--cic-pale);color:var(--cic-deep)}
.p-main .side>.menu a:hover{background:#F0F8F7}
.p-main .note.info{background:var(--cic-pale);color:var(--cic-deep);border-left:3px solid var(--cic-emerald)}
.p-main .tabs a:hover{color:var(--cic-emerald)}
.p-main .chip:not(.on):hover{border-color:var(--cic-emerald);background:var(--cic-pale)}
:is(.p-main,.gw) .btn:not(:disabled):not(.pri):not(.ok):not(.danger):hover,
body:has(.p-head) .modal .btn:not(:disabled):not(.pri):not(.ok):not(.danger):hover{
  background:var(--cic-pale);border-color:var(--cic-emerald);color:var(--cic-deep);
}
:is(.p-main,.gw) .btn.pri:not(:disabled):hover,
body:has(.p-head) .modal .btn.pri:not(:disabled):hover{

function riskScore(a) { const f = S.masters.risk; let s = 0, why = [];
  const add = (i, ok) => { if (ok && f[i] && f[i].active === 'Active') { s += +f[i].weight; why.push(f[i].name); } };
  add(0, S.apps.filter(x => x.companyId === a.companyId && x.status === 'Approved').length === 0); add(1, a.items.some(i => i.type === 'NPA')); add(2, a.items.some(i => itemAmt(i) > 200000));
  add(3, related(a.companyId).some(r => S.apps.some(x => x.companyId === r.c.id && !['Approved', 'Rejected', 'Draft'].includes(x.status)))); add(4, a.items.some(i => i.aiCheck === 'flag') || a.docs.some(d => d.ai === 'flag'));

  if ((el.tagName === 'INPUT' && el.type !== 'button') || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return;

const NC_CLAUSES = ['Funded item sold, leased or transferred', 'Funded item not used on Hong Kong construction works', 'Funded item idle or out of service', 'Change of use or location without CIC consent', 'Records or evidence not kept', 'Statutory requirement not met', 'Other CITF Terms & Conditions'];

function highValue(a) { return a.items.filter(i => i.approved != null && i.approved >= rule('usageMin')); }
function finalPaid(a) { const d = S.drs.find(x => x.appId === a.id && x.type === 'Final instalment' && x.status === 'Paid'); return d ? (d.paidOn || d.submittedOn) : null; };
function comp() { return (S.comp = S.comp || {usage:[], annual:[], nc:[], seq:31}); }
function ncRef() { return 'NC-2027-' + String(comp().seq++).padStart(4, '0'); }

/* trigger: create the three yearly confirmations after the final disbursement, open them ahead of the due date, flag overdue */
function compTick(silent) { const C0 = comp(); let opened = 0, created = 0;
  S.apps.filter(a => a.status === 'Approved' && finalPaid(a)).forEach(a => {
    for (let y = 1; y <= rule('annualYears'); y++) if (!C0.annual.some(x => x.appId === a.id && x.year === y)) { C0.annual.push({id:uid('ac'), appId:a.id, year:y, due:addDays(finalPaid(a), 365 * y), status:'Upcoming'}); created++; } });
  C0.annual.forEach(x => { const d = daysToC(x.due);
    if (x.status === 'Upcoming' && d <= rule('annualOpenDays')) { x.status = 'Open'; opened++; const a = app(x.appId), c = company(a.companyId);
      if (!silent) email('annual', c.contact.email, {Name:c.contact.name, Ref:a.ref, Year:x.year, Due:fmtD(x.due)}); else x.invited = true; }
    if (x.status === 'Open' && d < 0) x.status = 'Overdue'; });
  return {created, opened}; }
function daysToC(d) { return Math.ceil((new Date(d) - now()) / 864e5); }

  [['Admin', 'CITF Administrator', 'Harbour Build Engineering Limited', 'Company verified', 'Pending Vetting', 'Active', 'Registration approved', 'Review checklist complete; CompanyID CIC-C-002301 issued', -400],

/* ===== disbursement: milestone claims, expense reconciliation, payment status tracking ===== */
const DR_TYPES = [['First instalment', 'Deposit (first instalment)'], ['Progress instalment', 'Progress payment'], ['Final instalment', 'Final payment']];
const drLabel = t => (DR_TYPES.find(x => x[0] === t) || [t, t])[1];
const DR_STAGES = ['Submitted', 'Review', 'Approval', 'Finance processing', 'Payment released'];
function drStage(x) { return {Submitted:1, Vetting:1, Returned:1, 'Pending approval':2, 'DR approved – pending transfer':3, 'Finance signed off':3, Paid:5}[x.status] ?? 1; }
function drStamp(x, k) { x.ts = x.ts || {}; x.ts[k] = now().toISOString(); }
function grantPos(a) { const drs = S.drs.filter(d => d.appId === a.id && d.status !== 'Returned');
  const g = grantOf(a), paid = sum(drs.filter(d => d.status === 'Paid'), d => sum(d.lines, l => l.claim)), proc = sum(drs.filter(d => d.status !== 'Paid'), d => sum(d.lines, l => l.claim));
  return {g, paid, proc, left:g - paid - proc}; }
function itemClaimed(a, it) { return sum(S.drs.filter(d => d.appId === a.id && d.status !== 'Returned').flatMap(d => d.lines).filter(l => l.itemId === it.id), l => l.claim); }

    const cap = F.type === 'Final instalment' ? eligible : Math.min(eligible, Math.round(grant * rule('drFirst')));
    const now_ = Math.max(0, cap - before); return {it, budget, grant, spent, var:spent - budget, eligible, before, now:now_, after:grant - before - now_}; }); }
function reconHtml(a, F) { const R = recon(a, F), T = k => sum(R, r => r[k]); const unm = F.exp.filter(e => !e.item).length;
  return `<div class="scroll"><table class="tbl"><thead><tr><th>Approved budget line</th><th>Approved budget</th><th>Actual spend mapped</th><th>Variance</th><th>Eligible grant (${'×'} ratio)</th><th>Already claimed</th><th>Claim now</th><th>Remaining grant after</th></tr></thead><tbody>
  ${R.map(r => `<tr><td>${esc(r.it.product)}<br><small class="hint">${r.it.qty} × ${money(r.it.unit)} · ${Math.round(itemRatio(r.it) * 100)}% funded</small></td><td>${money(r.budget)}</td><td>${money(r.spent)}</td><td style="color:${r.var > 0 ? 'var(--err)' : r.var < 0 ? 'var(--warn)' : 'inherit'}">${r.var > 0 ? '+' + money(r.var) + '<br><small>over budget – not funded</small>' : r.var < 0 ? '−' + money(-r.var) + '<br><small>under budget</small>' : '–'}</td><td>${money(r.eligible)}</td><td>${money(r.before)}</td><td><b>${money(r.now)}</b></td><td>${money(r.after)}</td></tr>`).join('')}
  <tr style="font-weight:700"><td>Total</td><td>${money(T('budget'))}</td><td>${money(T('spent'))}</td><td></td><td>${money(T('eligible'))}</td><td>${money(T('before'))}</td><td>${money(T('now'))}</td><td>${money(T('after'))}</td></tr></tbody></table></div>
  ${unm ? `<div class="note warn">${unm} expense line(s) are not mapped to an approved budget line. Map every line before submitting.</div>` : ''}
  <span class="hint">${F.type === 'Final instalment' ? 'Final payment: the remaining eligible grant.' : 'Deposit and progress payments together are limited to ' + Math.round(rule('drFirst') * 100) + '% of each item’s approved grant; the rest is paid as the final payment.'} Figures update as you type.</span>`; }
function grantCard(a) { const p = grantPos(a), pc = v => p.g ? Math.round(v / p.g * 100) : 0;
  return `<div class="card"><div class="row between"><h2>Grant position</h2><span class="hint">Live · ${fmtDT(now().toISOString())}</span></div>
    <div class="kpis"><div class="kpi"><small>Approved grant</small><b>${money(p.g)}</b></div><div class="kpi"><small>Paid to date</small><b style="color:var(--ok)">${money(p.paid)}</b></div><div class="kpi"><small>In process</small><b>${money(p.proc)}</b></div><div class="kpi"><small>Remaining to be disbursed</small><b>${money(p.left)}</b></div></div>
    <div style="display:flex;height:12px;border-radius:6px;overflow:hidden;background:#E3E6EA" aria-label="Grant disbursed ${pc(p.paid)}%"><div style="width:${pc(p.paid)}%;background:var(--ok)"></div><div style="width:${pc(p.proc)}%;background:var(--gold)"></div></div>

  S.palApps.forEach(r => { if (r.kind === 'Change request' && !r.proposed) { const it = S.pal.find(p => r.name && p.name.startsWith(r.name.split(' v')[0].slice(0, 14))) || S.pal[0]; r.palId = r.palId || it.id;
    r.approvedSnap = {spec:it.spec, price:it.price, channel:it.channel}; r.proposed = {spec:'New model SE-500: 4K camera, edge AI for PPE, exclusion zones and fall detection, IP67, 5G.', price:r.price, channel:it.channel}; r.changes = ['spec', 'price']; r.just = r.note; } });

const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const h = [0x50, 0x4b, 3, 4, ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c), ...u32(d.length), ...u32(d.length), ...u16(n.length), ...u16(0)];
    parts.push(new Uint8Array(h), n, d); cen.push([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c), ...u32(d.length), ...u32(d.length), ...u16(n.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off), ...n]); off += h.length + n.length + d.length; });

  const all = [...parts, new Uint8Array(cd), new Uint8Array(end)], out = new Uint8Array(all.reduce((s, a) => s + a.length, 0)); let p = 0; all.forEach(a => { out.set(a, p); p += a.length; }); return out; }

  return zipStore([['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${x(s[0])}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`],

/* ---------- AI screening on the case ---------- */
const FLAGGED_VENDORS = {'Pacific Survey Supplies Ltd':'2 non-compliance findings in 2025 inspections (equipment not on site)'};
function aiScreen(a) { const c = company(a.companyId), st = calcSteps(a.companyId), crit = [];
  const add = (name, w, ok, why) => crit.push({name, w, ok, why});
  add('Company verified and in good standing', 15, c.status === 'Verified', c.status === 'Verified' ? 'Verified; BR valid to ' + fmtD(c.brExpiry) : 'Status ' + c.status);
  add('Items match the selected schemes', 15, a.items.every(i => i.type !== 'PA' || a.schemes.includes((i.paCode.split('-')[1] || ''))), a.items.length + ' item(s) checked against scheme lists');
  add('Quotations meet the value rules', 15, a.items.every(i => i.type === 'PA' || a.docs.filter(d => d.type === 'Quotation' && d.itemId === i.id).length >= quotesNeeded(i) || i.just), 'Rule: ≤ ' + money(rule('q1')) + ' 1, ≤ ' + money(rule('q2')) + ' 2, above 3');
  add('Documents consistent with the form', 20, !a.items.some(i => i.aiCheck === 'flag') && !a.docs.some(d => d.ai === 'flag'), a.items.some(i => i.aiCheck === 'flag') ? a.items.filter(i => i.aiCheck === 'flag').map(i => i.aiNote).join('; ') : 'No mismatch found by OCR');
  add('Within remaining ceiling', 15, st[4].value >= 0, 'Remaining after this case: ' + money(st[4].value));
  add('Implementation plans are specific', 10, a.items.every(i => /\d/.test(i.plan || '')), 'Plans include quantities, areas or targets');
  add('Non-pre-approved items justified', 10, a.items.every(i => i.type === 'PA' || (i.form1 && i.form1.f) || i.plan), 'Form 1 functions and innovation given');
  const score = sum(crit.filter(x => x.ok), x => x.w);
  const risks = []; const rel = related(a.companyId).map(r => r.c.id);
  S.apps.filter(x => x.id !== a.id && rel.includes(x.companyId) && !['Rejected', 'Withdrawn', 'Draft'].includes(x.status)).forEach(x => x.items.forEach(i => { if (a.items.some(j => j.paCode && j.paCode === i.paCode)) risks.push(['Possible duplicate across related companies', `${i.product} also applied for by ${company(x.companyId).nameEn} (${x.ref})`]); }));
  a.items.forEach(i => { const v = (S.pal.find(p => p.code === i.paCode) || {}).vendors || []; v.forEach(n => { if (FLAGGED_VENDORS[n]) risks.push(['Vendor with compliance history', n + ': ' + FLAGGED_VENDORS[n]]); }); });
  if (grantOf(a) > rule('vsc')) risks.push(['High-value case', 'Grant ' + money(grantOf(a)) + ' needs VSC review']);
  return {score, rec:score >= 85 ? 'Likely eligible – proceed to detailed vetting' : score >= 60 ? 'Eligible subject to queries' : 'High risk of ineligibility – check flagged criteria first', crit, risks}; }
