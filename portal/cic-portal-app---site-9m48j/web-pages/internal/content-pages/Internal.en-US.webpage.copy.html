<div id="citf-internal">
<style>
html, body { background:#F4F5F7 !important; color:#1F2933; }
#citf-internal{
  --cic-emerald:#007971; --cic-deep:#085669; --cic-teal:#109B9D; --cic-pale:#CFE9E6;
  --navy:#007971; --navy-d:#085669; --gold:#CFE9E6;
  --bg:#F4F5F7; --card:#fff; --line:#DDE1E6; --line-2:#EEF0F2;
  --ink:#1F2933; --ink-2:#3E4C59; --muted:#52606D; --field:#9AA5B1;
  --ok:#1E6B3A; --ok-bg:#E3F4E8; --warn:#92400E; --warn-bg:#FFF4E5; --err:#B42318; --err-bg:#FDECEA;
  --info:#0F5BA8; --info-bg:#E8F0FA;
  color:var(--ink); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:14px; line-height:1.45;
}
#citf-internal *{box-sizing:border-box}
#citf-internal a{color:var(--navy)}
#citf-internal button,#citf-internal input,#citf-internal select,#citf-internal textarea{font:inherit;color:inherit}
#citf-internal :focus-visible{outline:2px solid var(--cic-deep);outline-offset:2px}
#citf-internal .p-head{background:var(--cic-deep);color:#fff;border-bottom:4px solid var(--cic-teal)}
#citf-internal .p-head .in{max-width:1200px;margin:0 auto;min-height:92px;padding:20px 24px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
#citf-internal .logo{display:flex;align-items:center;gap:16px;color:#fff;text-decoration:none}
#citf-internal .logo b{display:block;font-size:24px;line-height:1.25;font-weight:700}
#citf-internal .logo small{display:block;color:var(--cic-pale);font-size:14px;line-height:1.5;margin-top:4px}
#citf-internal .p-nav{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
#citf-internal .p-nav a{color:#fff;text-decoration:none;padding:8px 0;border-bottom:3px solid transparent;font-size:16px;line-height:1.5}
#citf-internal .p-nav a.on{font-weight:600;border-bottom-color:var(--gold)}
#citf-internal .p-nav a:hover{color:var(--cic-pale);border-bottom-color:var(--cic-pale)}
#citf-internal .p-main{max-width:1280px;margin:0 auto;padding:28px 24px 100px;display:flex;flex-direction:column;gap:20px}
#citf-internal h1{margin:0;font-size:28px;line-height:1.25;font-weight:700;color:var(--cic-deep)}
#citf-internal h2{margin:0;font-size:20px;line-height:1.25;font-weight:600;color:var(--cic-deep)}
#citf-internal h3{margin:0;font-size:15px;line-height:1.25;color:var(--ink)}
#citf-internal .sub{margin:4px 0 0;color:var(--muted);line-height:1.6}
#citf-internal .hint{font-size:12px;color:var(--muted);font-weight:400}
#citf-internal .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
#citf-internal .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
#citf-internal .row.between{justify-content:space-between}
#citf-internal .internal-eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:600}
#citf-internal .internal-filters{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px}
#citf-internal .internal-money{white-space:nowrap}
#citf-internal .internal-empty{padding:32px 16px;text-align:center}
#citf-internal .internal-empty h3{margin-bottom:6px}
#citf-internal .f{display:flex;flex-direction:column;gap:5px;min-width:0}
#citf-internal .f>label{font-size:13px;font-weight:600}
#citf-internal .f input,#citf-internal .f select,#citf-internal .f textarea{border:1px solid var(--field);border-radius:4px;background:#fff;width:100%;font:inherit}
#citf-internal .f input,#citf-internal .f select{height:40px;padding:0 10px}
#citf-internal .f textarea{height:auto;padding:8px 10px;resize:vertical}
#citf-internal .f .er{font-size:12px;color:var(--err)}
#citf-internal .btn{height:40px;padding:0 18px;border-radius:4px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
#citf-internal .btn.pri{background:var(--navy);color:#fff}
#citf-internal .btn.ghost{border-color:var(--field);color:var(--ink-2);background:#fff}
#citf-internal .btn.sm{height:32px;padding:0 12px;font-size:13px}
#citf-internal .btn.pri:hover{background:var(--cic-deep);border-color:var(--cic-deep);color:#fff}
#citf-internal .btn:not(.pri):not(.ghost):hover{background:var(--cic-pale);border-color:var(--cic-emerald);color:var(--cic-deep)}
#citf-internal .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:#EEF0F2;color:var(--ink-2);white-space:nowrap}
#citf-internal .pill.ok{background:var(--ok-bg);color:var(--ok)}
#citf-internal .pill.warn{background:var(--warn-bg);color:var(--warn)}
#citf-internal .pill.info{background:var(--info-bg);color:var(--info)}
#citf-internal .pill.err{background:var(--err-bg);color:var(--err)}
#citf-internal .note{border-radius:6px;padding:12px 16px;font-size:14px}
#citf-internal .note.info{background:var(--cic-pale);color:var(--cic-deep);border-left:3px solid var(--cic-emerald)}
#citf-internal .note.warn{background:var(--warn-bg);color:#6B3E00;border:1px solid #F0B866}
#citf-internal .note.err{background:var(--err-bg);color:var(--err)}
#citf-internal .scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
#citf-internal table.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:0}
#citf-internal table.tbl th{text-align:left;background:var(--cic-pale);color:var(--cic-deep);padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line)}
#citf-internal table.tbl td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:top;background:#fff}
#citf-internal table.tbl a{color:var(--navy);font-weight:700;text-decoration:none}
#citf-internal table.tbl a:hover{text-decoration:underline}
#citf-internal table.tbl td span,#citf-internal table.tbl td small{color:var(--muted);font-weight:400}
#citf-internal .tabs{display:flex;flex-wrap:wrap;gap:22px;border-bottom:1px solid var(--line)}
#citf-internal .tabs a{padding:12px 0;text-decoration:none;color:var(--ink-2);border-bottom:3px solid transparent}
#citf-internal .tabs a.on{color:var(--navy);font-weight:600;border-bottom-color:var(--navy)}
#citf-internal .kv{display:grid;grid-template-columns:180px 1fr;gap:6px 12px;font-size:13px}
#citf-internal .kv span:nth-child(odd){color:var(--muted)}
#citf-internal .internal-detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
#citf-internal .internal-content,#citf-internal .internal-side{display:flex;flex-direction:column;gap:20px;min-width:0}
#citf-internal .internal-ai{border-top:4px solid var(--cic-emerald)}
#citf-internal .internal-ai p,#citf-internal .internal-ai li{line-height:1.65}
#citf-internal .internal-ai ul{margin:0;padding-left:22px}
#citf-internal .internal-summary{font-size:16px;margin:0}
#citf-internal .internal-ai-footer{border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}
#citf-internal .internal-facts{display:flex;flex-direction:column;gap:5px;overflow-wrap:anywhere}
#citf-internal .internal-facts>span:nth-child(odd){color:var(--muted);font-size:13px;margin-top:9px}
#citf-internal .internal-item{border:1px solid var(--line);border-radius:6px;padding:16px}
#citf-internal .internal-item summary{cursor:pointer;font-weight:600;line-height:1.6}
#citf-internal .internal-item summary span{color:var(--cic-deep);white-space:nowrap}
#citf-internal .internal-item .kv{margin-top:16px}
#citf-internal .internal-item h3{margin-top:16px}
#citf-internal .internal-query{padding:12px 0;border-bottom:1px solid var(--line)}
#citf-internal .internal-history{padding-left:20px;margin:0}
#citf-internal .internal-history li{padding:0 0 16px}
#citf-internal .internal-history small{color:var(--muted)}
#citf-internal .internal-history p{margin:5px 0 0}
#citf-internal .signin-card{max-width:560px}
#citf-internal .scrim{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
#citf-internal .modal{background:#fff;border-radius:8px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);color:var(--ink)}
#citf-internal .modal .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
#citf-internal .toast{position:fixed;right:20px;bottom:20px;z-index:90;background:var(--ok);color:#fff;border-radius:6px;padding:12px 18px;max-width:360px}
#citf-internal .toast.err{background:var(--err)}
#citf-internal .chat-workspace{display:grid;grid-template-columns:280px minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:620px}
#citf-internal .chat-sidebar{background:#f5f8f8;border-right:1px solid var(--line);padding:16px;min-width:0}
#citf-internal .chat-sidebar-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
#citf-internal .chat-sidebar-heading h2{font-size:18px}
#citf-internal .chat-tabs{display:flex;flex-direction:column;gap:8px}
#citf-internal .chat-tab{display:flex;flex-direction:column;gap:7px;padding:15px;text-align:left;font:inherit;background:transparent;border:1px solid transparent;border-radius:7px;cursor:pointer;min-width:0;color:var(--ink)}
#citf-internal .chat-tab[aria-selected=true]{background:var(--cic-pale);border-color:var(--cic-emerald)}
#citf-internal .chat-tab-title{font-weight:600;overflow-wrap:anywhere}
#citf-internal .chat-preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-size:13px;color:var(--muted)}
#citf-internal .chat-tab-status{font-size:12px;color:var(--cic-deep)}
#citf-internal .chat-panel{min-width:0;display:flex;flex-direction:column}
#citf-internal .chat-heading{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:12px}
#citf-internal .chat-heading>div{flex:1}
#citf-internal .chat-log{padding:24px;display:flex;flex-direction:column;gap:20px;max-height:520px;min-height:240px;overflow-y:auto;background:#fafbfc}
#citf-internal .chat-bubble{padding:16px 18px;border-radius:12px;max-width:88%;overflow-wrap:anywhere;background:#fff;border:1px solid var(--line)}
#citf-internal .chat-outgoing{align-self:flex-end;background:var(--cic-pale);border-color:var(--cic-pale)}
#citf-internal .chat-incoming{align-self:flex-start}
#citf-internal .chat-message-meta{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
#citf-internal .chat-bubble p{white-space:pre-wrap;line-height:1.6;margin:10px 0 0}
#citf-internal .chat-request{margin-top:12px;padding:12px;background:#ffffffb3;border-radius:6px}
#citf-internal .chat-request ul{margin:8px 0;padding-left:20px}
#citf-internal .chat-composer{padding:20px 24px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);margin-top:auto}
#citf-internal .chat-composer>label{font-weight:600}
#citf-internal .chat-composer textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--field);border-radius:6px;resize:vertical}
#citf-internal .chat-composer summary{cursor:pointer;color:var(--cic-deep)}
#citf-internal .chat-composer details>.f{margin-top:12px}
#citf-internal .chat-empty{padding:60px 30px;text-align:center;margin:auto}
#citf-internal .page-foot{display:flex;justify-content:flex-end}
@media(max-width:900px){#citf-internal .internal-detail-grid{grid-template-columns:1fr}#citf-internal .internal-side{display:grid;grid-template-columns:1fr 1fr}#citf-internal .internal-side section:last-child{grid-column:1/-1}}
@media(max-width:850px){#citf-internal .p-head .in{align-items:flex-start;gap:16px}#citf-internal .p-head .p-nav{width:100%}#citf-internal .chat-workspace{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:600px){#citf-internal .p-head .in{min-height:80px;padding:16px}#citf-internal .logo b{font-size:22px}#citf-internal .p-main{padding:24px 16px 40px}#citf-internal h1{font-size:24px}#citf-internal .internal-filters,#citf-internal .internal-side{grid-template-columns:1fr}#citf-internal .internal-main .kv{grid-template-columns:1fr}#citf-internal .chat-workspace{grid-template-columns:1fr}}
</style>

<script>

  document.documentElement.classList.add("citf-internal");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString(); }

  function itemAmt(it) { return (+it.qty || 0) * (+it.unit || 0); }

  function appAmt(a) { return a.items.reduce(function (t, it) { return t + itemAmt(it); }, 0); }
  function grantOf(a) { return Math.round(a.items.reduce(function (t, it) { return t + itemGrant(it); }, 0)); }
  function pledgeDays(a) { var days = { BIM: 30, ACT: 30, STB: 30, MiC: 45, MiMEP: 45, MPD: 30 }; var n = 0; a.schemes.forEach(function (c) { n = Math.max(n, days[c] || 30); }); if (a.items.some(function (i) { return i.type === "NPA"; })) n = Math.max(n, 45); return n; }

  var a1 = makeApp({ id: "ap46", ref: "CITF-2027-00046", schemes: ["ACT"], project: "Tung Chung New Town Extension \u2013 Site 3", status: "Vetting in progress", submittedOn: addDays(new Date(), -6), officer: "Mandy Chan", priority: "High", otherFund: "None declared",

    items: [

  a1.history = [{ on: a1.submittedOn, what: "Application submitted via portal" }, { on: a1.submittedOn, what: "Auto-assigned to Mandy Chan (load-balanced)" }];

  makeApp({ id: "ap47", ref: "CITF-2027-00047", schemes: ["BIM"], project: "Kai Tak Sports Park Phase 2", status: "Pending committee", submittedOn: addDays(new Date(), -21), officer: "Mandy Chan",

  makeApp({ id: "ap48", ref: "CITF-2027-00048", schemes: ["ACT"], project: "Kai Tak Sports Park Phase 2", status: "Approved", submittedOn: addDays(new Date(), -75), officer: "Tony Lee", priority: "Normal",

    try { var input = document.querySelector("input[name='__RequestVerificationToken']"); token = input && input.value || ""; } catch (e0) { token = ""; }
    var headers = { Accept: "application/json", "Content-Type": "application/json", "OData-MaxVersion": "4.0", "OData-Version": "4.0", Prefer: "return=representation" };
    if (token) headers.__RequestVerificationToken = token;
    function post(url, body) {
      return fetch(url, { method: "POST", headers: headers, credentials: "same-origin", body: JSON.stringify(body) }).then(function (res) {
        return res.text().then(function (raw) {
          var msg = raw;
          try { var parsed = JSON.parse(raw || "{}"); msg = (parsed.error && (parsed.error.message || (parsed.error.innererror && parsed.error.innererror.message))) || raw; } catch (e1) {}
          if (!res.ok) throw new Error((msg || "Email was not sent (" + res.status + ")").replace(/\s+/g, " ").slice(0, 360));
          return { raw: raw, res: res };
        });
      });
    }
    return post("/_api/emails", { subject: subject, description: text.replace(/\n/g, "<br>"), directioncode: true }).then(function (createdRes) {
      var created = {};
      try { created = JSON.parse(createdRes.raw || "{}"); } catch (e2) { created = {}; }
      var id = created.activityid || ((String(createdRes.res.headers.get("OData-EntityId") || "").match(/[0-9a-f-]{36}/i) || [])[0]);
      if (!id) throw new Error("The committee email was created but its id was not returned.");
    });
  }
  function openChat(a) {
    UI.modal = requestForm(a, a.internalRequestDraft || {});
    paintModal();
  }

  document.getElementById("citf-internal").addEventListener("click", function (e) {
    var actEl = e.target.closest("[data-act]");
    var linkEl = e.target.closest("a[href]");
    if (linkEl && !actEl) {
      var url = new URL(linkEl.getAttribute("href"), location.href);
      if (url.origin === location.origin && url.pathname === location.pathname) { e.preventDefault(); go(url.search); }
      return;
    }
    if (!actEl) return;
    var act = actEl.dataset.act;
    if (act === "signIn") return;
    if (act === "signOut") { try { sessionStorage.removeItem(KEY); } catch (err) {} UI.query = ""; UI.status = ""; closeModal(); go(""); return; }
    if (act === "clear") { UI.query = ""; UI.status = ""; render(); return; }
    if (act === "close") { if (actEl.classList.contains("scrim") && e.target.closest(".modal")) return; e.preventDefault(); closeModal(); return; }
    if (act === "newChat") { var app = owned(actEl.dataset.id); if (app) openChat(app); return; }
    if (act === "saveDraft" || act === "sendRequest") {
      var appR = owned(actEl.dataset.id); if (!appR) return;
      var d = collectRequest(actEl);
      if (act === "saveDraft") { appR.internalRequestDraft = d; closeModal(); toast("Request saved as a draft. It has not been sent."); go(link(appR.id, "correspondence").replace(location.pathname, "")); return; }
      var approval = d.requestType === "Approval request";
      var docs = (d.requestType === "Question" || approval) ? [] : d.documents.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
      var today = new Date().toISOString().slice(0, 10);
      var error = !d.subject ? "Enter a subject." : !d.message ? (approval ? "Write a message to the committee." : "Write a message to the applicant.") : approval ? "" : !/^\d{4}-\d{2}-\d{2}$/.test(d.due) ? "Choose a reply date." : d.due < today ? "Choose today or a future reply date." : d.requestType !== "Question" && !docs.length ? "List the documents the applicant needs to provide." : "";
      var errBox = document.getElementById("internal-request-error");
      if (error) { if (errBox) errBox.textContent = error; return; }
      if (approval) {
        actEl.disabled = true;
        sendCommitteeEmail(appR, d).then(function () {
          var qid = "q" + Math.random().toString(36).slice(2, 8);
          var sentOn = new Date().toISOString();
          appR.queries.push({ id: qid, field: d.subject, q: d.message, on: sentOn, by: officer(), requestType: "Approval request", audience: "committee", committeeEmail: "brwei@deloittecn.com.cn", docsRequested: [], ans: "", files: [], messages: [{ role: "officer", by: officer(), text: d.message, on: sentOn, documents: [], due: "", committee: true }] });
          appR.internalRequestDraft = null;
          appR.history.push({ on: sentOn, what: "Approval request emailed to committee (brwei@deloittecn.com.cn) by " + officer() + ": " + d.subject });
          UI.selected[appR.id] = qid;
          closeModal();
          toast("Approval request emailed to brwei@deloittecn.com.cn");
          go(link(appR.id, "correspondence").replace(location.pathname, ""));
        }).catch(function (err) {
          actEl.disabled = false;
          if (errBox) errBox.textContent = String((err && err.message) || err || "The committee email was not sent.");
        });
        return;
      }
      var qid = "q" + Math.random().toString(36).slice(2, 8);
      appR.queries.push({ id: qid, field: d.subject, q: d.message, on: new Date().toISOString(), due: d.due, by: officer(), requestType: d.requestType, docsRequested: docs, ans: "", files: [], messages: [{ role: "officer", by: officer(), text: d.message, on: new Date().toISOString(), documents: docs, due: docs.length ? d.due : "" }] });
      appR.internalRequestDraft = null;
      if (["Approved", "Rejected", "Withdrawn"].indexOf(appR.status) < 0) appR.status = "Pending information";
      appR.history.push({ on: new Date().toISOString(), what: "Request sent to applicant by " + officer() + ": " + d.subject });
      UI.selected[appR.id] = qid;
      closeModal();
      toast("Request sent to the applicant portal (demo).");
      go(link(appR.id, "correspondence").replace(location.pathname, ""));
      return;
    }
    if (act === "chatSelect") { UI.selected[actEl.dataset.id] = actEl.dataset.q; render(); return; }
    if (act === "chatSave" || act === "chatSend" || act === "reviewed") {
      var appC = owned(actEl.dataset.id); if (!appC) return;
      var q = appC.queries.filter(function (item) { return item.id === actEl.dataset.q; })[0]; if (!q) return;
      if (act === "reviewed") { if (!q.ans) return; q.reviewed = true; appC.history.push({ on: new Date().toISOString(), what: "Applicant response reviewed by " + officer() + ": " + q.field }); render(); toast("Response marked reviewed."); return; }
      var form = actEl.closest("form");
      var data = form ? formData(form) : {};
      q.chatDrafts = q.chatDrafts || {};
      q.chatDrafts.officer = { text: data.text || "", documents: data.documents || "", due: data.due || "", files: [] };
      if (act === "chatSave") { toast("Message saved as a draft."); return; }
      var text = String(data.text || "").trim();
      var documents = String(data.documents || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      if (!text) { toast("Write a message or attach a sample document.", true); return; }
      if (documents.length && (!data.due || data.due < new Date().toISOString().slice(0, 10))) { toast("Choose today or a future reply deadline for the document request.", true); return; }
      q.messages = chatHistory(q).slice();
      q.messages.push({ role: "officer", by: officer(), text: text, on: new Date().toISOString(), documents: documents, due: documents.length ? data.due : "" });
      q.q = q.q || text;
      q.field = q.field || "Message";
      q.ans = "";
      q.reviewed = false;
      if (documents.length) { q.docsRequested = documents; q.due = data.due; }
      if (["Approved", "Rejected", "Withdrawn"].indexOf(appC.status) < 0) appC.status = "Pending information";
      q.chatDrafts.officer = { text: "", files: [], documents: "", due: "" };
      appC.history.push({ on: new Date().toISOString(), what: "Officer sent a chat message: " + q.field });
      render();
      toast("Message sent in this demo.");
    }
  });
  document.getElementById("citf-internal").addEventListener("submit", function (e) {
    if (e.target.id === "signin-form") { e.preventDefault(); signIn(e.target); }
  });
  document.getElementById("citf-internal").addEventListener("input", function (e) {
    if (e.target.id === "internal-search") { UI.query = e.target.value; UI.focusSearch = e.target.selectionStart; render(); return; }
    var f = e.target.closest("form[data-chat]");
    if (!f) return;
    var appC = owned(f.dataset.app); var q = appC && appC.queries.filter(function (item) { return item.id === f.dataset.chat; })[0];
    if (!q) return;
    var d = formData(f);
    q.chatDrafts = q.chatDrafts || {};
    q.chatDrafts.officer = { text: d.text || "", documents: d.documents || "", due: d.due || "", files: [] };
  });
  document.getElementById("citf-internal").addEventListener("change", function (e) {
    if (e.target.id === "internal-status") { UI.status = e.target.value; render(); }
    if (e.target.name === "requestType") {
      var send = document.querySelector("[data-act='sendRequest']");
      var app = send && owned(send.dataset.id);
      if (!app) return;
      UI.modal = requestForm(app, collectRequest(e.target));
      paintModal();
    }
  });
  window.addEventListener("popstate", render);
  render();
})();
</script>
